# CI/CD for the Gift of the Givers solution. Runs on every commit to master.
# Build:        restore, build, then unit tests -> integration tests -> load test (each its own step and test run).
# UITests:      start the web app on the agent and run the Selenium tests against it in headless Chrome.
# Package:      publish the web and Functions apps and pack the Helpers library.
# DeploySql:    apply db/001_schema.sql to Azure SQL.
# DeployWeb:    deploy the ASP.NET Core app to Azure App Service.
# DeployFunctions: deploy the Azure Functions app.
# SmokeTest:    call the deployed GenerateTaxCertificate function using the FunctionKey secret.
# A failing test stops the run, so nothing is deployed unless every test passed.

trigger:
  branches:
    include:
      - master
  paths:
    exclude:
      - README.md

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  solution: Part1.sln
  testProject: GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj
  uiTestProject: GiftOfTheGivers.UITests/GiftOfTheGivers.UITests.csproj
  webProject: Part1/Part1.csproj
  functionsProject: GiftOfTheGivers.Functions/GiftOfTheGivers.Functions.csproj
  helpersProject: GiftOfTheGivers.Helpers/GiftOfTheGivers.Helpers.csproj
  functionsBaseUrl: https://st10455219giftofthegivers-functions.azurewebsites.net/api
  # Section C: deployment targets. Change these to match your Azure resources.
  azureServiceConnection: GiftOfTheGivers-Azure        # Project settings > Service connections (Azure Resource Manager)
  webAppName: ST10455219GiftoftheGivers-Groupwork      # App Service (Windows)
  functionAppName: st10455219giftofthegivers-functions # Function App
  sqlServerName: your-sql-server.database.windows.net  # Azure SQL logical server
  sqlDatabaseName: Part1Db
  sqlAdminUser: sqladmin
  # SqlAdminPassword is a secret pipeline variable (Edit > Variables > Keep this value secret)
  # Set to true to push a new Helpers version to the feed (the build service needs Contributor on the feed)
  publishHelpers: false
  # FunctionKey is a secret variable. It is added in the pipeline settings (Edit > Variables,
  # "Keep this value secret") and is never stored in this file.

stages:
  - stage: Build
    displayName: Restore, build and test
    jobs:
      - job: BuildAndTest
        displayName: Build and test
        steps:
          - template: pipelines/templates/restore-steps.yml
            parameters:
              solution: $(solution)

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: $(solution)
              arguments: --configuration $(buildConfiguration) --no-restore

          # B.1: unit tests run on every commit. Integration and load tests have their own Category trait.
          - task: DotNetCoreCLI@2
            displayName: Unit tests
            inputs:
              command: test
              projects: $(testProject)
              arguments: --configuration $(buildConfiguration) --no-build --filter "Category!=Integration&Category!=Load" --collect "XPlat Code Coverage"
              publishTestResults: true
              testRunTitle: Unit tests

          - task: DotNetCoreCLI@2
            displayName: Integration tests
            inputs:
              command: test
              projects: $(testProject)
              arguments: --configuration $(buildConfiguration) --no-build --filter "Category=Integration"
              publishTestResults: true
              testRunTitle: Integration tests

          - task: DotNetCoreCLI@2
            displayName: Load test (5 concurrent users)
            env:
              LOAD_USERS: 5
              LOAD_ITERATIONS: 10
              LOAD_MAX_MS: 2000
            inputs:
              command: test
              projects: $(testProject)
              arguments: --configuration $(buildConfiguration) --no-build --filter "Category=Load" --logger "console;verbosity=detailed"
              publishTestResults: true
              testRunTitle: Load test

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(Agent.TempDirectory)/**/coverage.cobertura.xml

  - stage: UITests
    displayName: Selenium UI tests
    dependsOn: Build
    jobs:
      - job: Selenium
        displayName: Run Selenium tests in Chrome
        steps:
          - template: pipelines/templates/restore-steps.yml
            parameters:
              solution: $(solution)

          - script: dotnet publish $(webProject) --configuration $(buildConfiguration) --no-restore --output $(Build.BinariesDirectory)/web-ui
            displayName: Publish web app for UI tests

          - bash: |
              cd "$(Build.BinariesDirectory)/web-ui"
              nohup dotnet Part1.dll --urls http://localhost:5171 > "$(Build.ArtifactStagingDirectory)/webapp.log" 2>&1 &
              for i in $(seq 1 30); do
                if curl -s -o /dev/null http://localhost:5171/; then echo "Site is up"; exit 0; fi
                sleep 2
              done
              echo "Site did not start"; cat "$(Build.ArtifactStagingDirectory)/webapp.log"; exit 1
            displayName: Start the web app

          - task: DotNetCoreCLI@2
            displayName: Selenium tests
            env:
              UI_TEST_BASE_URL: http://localhost:5171
              UI_TEST_HEADLESS: true
            inputs:
              command: test
              projects: $(uiTestProject)
              arguments: --configuration $(buildConfiguration) --logger "console;verbosity=detailed"
              publishTestResults: true
              testRunTitle: Selenium UI tests

  - stage: Package
    displayName: Package
    dependsOn:
      - Build
      - UITests
    jobs:
      - job: Package
        displayName: Publish apps and pack Helpers
        steps:
          - template: pipelines/templates/restore-steps.yml
            parameters:
              solution: $(solution)

          - task: DotNetCoreCLI@2
            displayName: Publish web app
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(webProject)
              arguments: --configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/web
              zipAfterPublish: true

          - task: DotNetCoreCLI@2
            displayName: Publish Functions app
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(functionsProject)
              arguments: --configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/functions
              zipAfterPublish: true

          - task: DotNetCoreCLI@2
            displayName: Pack GiftOfTheGivers.Helpers
            inputs:
              command: pack
              packagesToPack: $(helpersProject)
              configuration: $(buildConfiguration)
              packDirectory: $(Build.ArtifactStagingDirectory)/packages
              versioningScheme: off

          # Versions already in the feed are skipped, so only a bumped <Version> gets published
          - script: dotnet nuget push "$(Build.ArtifactStagingDirectory)/packages/*.nupkg" --source GiftOfTheGiversHelpers --api-key AzureArtifacts --skip-duplicate
            displayName: Push Helpers to Azure Artifacts
            condition: and(succeeded(), eq(variables['publishHelpers'], 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

          - task: PublishPipelineArtifact@1
            displayName: Publish build artifacts
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: drop

  # ---------------- Section C: continuous deployment ----------------
  # Each deployment job downloads the 'drop' artifact produced by the Package stage.

  - stage: DeploySql
    displayName: C.3 Deploy SQL schema
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: Sql
        displayName: Apply db/001_schema.sql
        pool:
          vmImage: windows-latest   # the SQL deployment task runs on Windows agents
        steps:
          - checkout: self
          - task: SqlAzureDacpacDeployment@1
            displayName: Run schema script on Azure SQL
            inputs:
              azureSubscription: $(azureServiceConnection)
              AuthenticationType: server
              ServerName: $(sqlServerName)
              DatabaseName: $(sqlDatabaseName)
              SqlUsername: $(sqlAdminUser)
              SqlPassword: $(SqlAdminPassword)
              deployType: SqlTask
              SqlFile: $(Build.SourcesDirectory)/db/001_schema.sql

  - stage: DeployWeb
    displayName: C.1 Deploy web app
    dependsOn: DeploySql
    jobs:
      - deployment: WebApp
        displayName: Deploy to Azure App Service
        environment: giftofthegivers-production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: Deploy ASP.NET Core app
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webApp
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/drop/web/*.zip

  - stage: DeployFunctions
    displayName: C.2 Deploy Azure Functions
    dependsOn: DeployWeb
    jobs:
      - deployment: Functions
        displayName: Deploy to Azure Function App
        environment: giftofthegivers-production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureFunctionApp@2
                  displayName: Deploy Functions project
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: functionApp          # use functionAppLinux if the Function App runs on Linux
                    appName: $(functionAppName)
                    package: $(Pipeline.Workspace)/drop/functions/*.zip

  - stage: SmokeTest
    displayName: Smoke test deployed function
    dependsOn: DeployFunctions
    jobs:
      - job: SmokeTest
        displayName: Call GenerateTaxCertificate
        steps:
          - checkout: none

          - pwsh: |
              # Secrets are not passed to scripts automatically, so FUNCTION_KEY is mapped below
              if ([string]::IsNullOrWhiteSpace($env:FUNCTION_KEY) -or $env:FUNCTION_KEY.StartsWith('$(')) {
                Write-Host "##vso[task.logissue type=warning]The FunctionKey secret is not set, so the smoke test was skipped."
                exit 0
              }

              $url = "$(functionsBaseUrl)/GenerateTaxCertificate?amount=100&currency=ZAR&donorName=Pipeline%20Check&donationType=once-off"
              $response = Invoke-RestMethod -Uri $url -Headers @{ 'x-functions-key' = $env:FUNCTION_KEY }

              if ($response.certificateNumber -notmatch '^GOTG-\d{8}-[0-9A-F]{6}$') {
                throw "Unexpected response from the deployed function."
              }
              Write-Host "Deployed function issued certificate $($response.certificateNumber)"
            displayName: Request a tax certificate
            env:
              FUNCTION_KEY: $(FunctionKey)
